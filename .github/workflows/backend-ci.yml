name: Backend CI
on:
  pull_request:
    paths: ['services/server/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [main]
    paths: ['services/server/**', '.github/workflows/backend-ci.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 22, cache: maven }
      - name: Run Maven verify
        id: maven-verify
        run: mvn --batch-mode verify
      - name: Publish backend test summary
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.maven-verify.outcome }}" == "failure" ]] && compgen -G "target/surefire-reports/*.txt" > /dev/null; then
            grep -hE '<<< FAILURE!|Failures:|Errors:|Caused by:|AssertionError|expected:|but was:|ERROR:' \
              target/surefire-reports/*.txt | head -40 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error title=Backend test failure::$line"
            done
          fi
          {
            echo "## Backend test summary"
            echo
            if compgen -G "target/surefire-reports/*.txt" > /dev/null; then
              for report in target/surefire-reports/*.txt; do
                echo "<details>"
                echo "<summary>$(basename "$report")</summary>"
                echo
                echo '```text'
                cat "$report"
                echo '```'
                echo "</details>"
                echo
              done
            else
              echo "No Surefire text reports were generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend test reports
        if: steps.maven-verify.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-reports
          path: services/server/target/surefire-reports/
          if-no-files-found: warn
