name: Backend CI
on:
  pull_request:
    paths: ['services/server/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [main]
    paths: ['services/server/**', '.github/workflows/backend-ci.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 22, cache: maven }
      - run: mvn --batch-mode verify
