name: Python CI
on:
  pull_request:
    paths: ['services/model-api/**', 'workers/model-worker/**', '.github/workflows/python-ci.yml']
  push:
    branches: [main]
    paths: ['services/model-api/**', 'workers/model-worker/**', '.github/workflows/python-ci.yml']
jobs:
  model-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: python -m pip install -e "services/model-api[dev]"
      - run: ruff check services/model-api
      - run: mypy --config-file services/model-api/pyproject.toml services/model-api/src
      - run: pytest services/model-api
