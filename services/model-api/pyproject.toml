[project]
name = "originguard-model-api"
version = "0.1.0"
description = "OriginGuard model inference API skeleton"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi>=0.116,<1", "pydantic>=2.11,<3", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "mypy>=1.17,<2", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
