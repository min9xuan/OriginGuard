[project]
name = "originguard-model-api"
version = "0.1.0"
description = "OriginGuard model inference API skeleton"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "open-clip-torch==2.24.0",
    "openai-clip==1.0.1",
    "pillow>=11,<12",
    "numpy>=1.26,<2",
    "pydantic>=2.11,<3",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "transformers>=4.57,<5",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "mypy>=1.17,<2", "pytest>=8.4,<9", "ruff>=0.12,<1"]
anixplore = [
    "albumentations>=1.4,<2",
    "einops>=0.8,<1",
    "fvcore>=0.1.5.post20221221",
    "numpy>=1.26,<2",
    "PyWavelets>=1.6,<2",
    "timm>=1.0,<2",
]
aeroblade = [
    "diffusers>=0.32,<1",
    "lpips>=0.1.4,<1",
]
mesorch = [
    "imdlbenco>=0.1.29,<0.2",
    "timm>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
    "aeroblade.*",
    "clip",
    "diffusers",
    "diffusers.*",
    "IMDLBenCo.*",
    "lpips",
    "torchvision",
    "torchvision.*",
    "data.dct",
    "models.AIDE",
    "mesorch",
]
ignore_missing_imports = true
