spring:
  application:
    name: originguard-server
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:15432}/${POSTGRES_DB:originguard}}
    username: ${POSTGRES_USER:originguard}
    password: ${POSTGRES_PASSWORD:change-me}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

originguard:
  security:
    jwt:
      issuer: ${JWT_ISSUER:originguard-local}
      secret: ${ORIGINGUARD_JWT_SECRET}
      access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
      refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:originguard}
    secret-key: ${MINIO_ROOT_PASSWORD:change-me-now}
    bucket: ${MINIO_BUCKET:originguard-media}
    max-upload-bytes: ${MEDIA_MAX_UPLOAD_BYTES:26214400}
  embedding:
    provider: ${EMBEDDING_PROVIDER:bge-small-zh-v1.5}
    model-api-base-url: ${MODEL_API_BASE_URL:http://localhost:8090}
    timeout: ${EMBEDDING_TIMEOUT:PT30S}
  knowledge-expansion:
    openalex-base-url: ${OPENALEX_BASE_URL:https://api.openalex.org}
    openalex-api-key: ${OPENALEX_API_KEY:}
    timeout: ${RAG_KNOWLEDGE_EXPANSION_TIMEOUT:PT20S}
  agent:
    aigc-detector:
      provider: ${AIGC_DETECTOR_PROVIDER:model-api}
      base-url: ${MODEL_API_BASE_URL:http://127.0.0.1:8090}
      timeout: ${AIGC_DETECTOR_TIMEOUT:PT10M}
    media-type-classifier:
      provider: ${MEDIA_TYPE_CLASSIFIER_PROVIDER:model-api}
      base-url: ${MODEL_API_BASE_URL:http://127.0.0.1:8090}
      timeout: ${CLIP_CLASSIFIER_TIMEOUT:PT2M}
    aigc-explainer:
      provider: ${AIGC_EXPLAINER_PROVIDER:template}
      base-url: ${QWEN_VL_BASE_URL:http://127.0.0.1:8092}
      model: ${QWEN_VL_MODEL:qwen3-vl-4b-instruct-q4-k-m}
      timeout: ${QWEN_VL_TIMEOUT:PT5M}
      max-image-edge: ${QWEN_VL_MAX_IMAGE_EDGE:896}
    planner:
      provider: ${AGENT_PLANNER_PROVIDER:fake}
      base-url: ${QWEN_VL_BASE_URL:http://127.0.0.1:8092}
      model: ${QWEN_VL_MODEL:qwen3-vl-4b-instruct-q4-k-m}
      timeout: ${QWEN_VL_TIMEOUT:PT5M}
      max-image-edge: ${QWEN_VL_MAX_IMAGE_EDGE:896}
