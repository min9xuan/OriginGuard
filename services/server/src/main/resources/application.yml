spring:
  application:
    name: originguard-server
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:15432}/${POSTGRES_DB:originguard}}
    username: ${POSTGRES_USER:originguard}
    password: ${POSTGRES_PASSWORD:change-me}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:25672}
    username: ${RABBITMQ_DEFAULT_USER:originguard}
    password: ${RABBITMQ_DEFAULT_PASS:change-me}
    listener:
      simple:
        concurrency: 1
        max-concurrency: 2
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2
          max-attempts: 3
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: ${SERVER_PORT:18080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

originguard:
  security:
    jwt:
      issuer: ${JWT_ISSUER:originguard-local}
      secret: ${ORIGINGUARD_JWT_SECRET}
      access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
      refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:originguard}
    secret-key: ${MINIO_ROOT_PASSWORD:change-me-now}
    bucket: ${MINIO_BUCKET:originguard-media}
    max-upload-bytes: ${MEDIA_MAX_UPLOAD_BYTES:26214400}
  embedding:
    provider: ${EMBEDDING_PROVIDER:bge-small-zh-v1.5}
    model-api-base-url: ${MODEL_API_BASE_URL:http://localhost:8090}
    timeout: ${EMBEDDING_TIMEOUT:PT30S}
  knowledge-expansion:
    openalex-base-url: ${OPENALEX_BASE_URL:https://api.openalex.org}
    openalex-api-key: ${OPENALEX_API_KEY:}
    timeout: ${RAG_KNOWLEDGE_EXPANSION_TIMEOUT:PT20S}
  assistant:
    llm:
      provider: ${ASSISTANT_LLM_PROVIDER:local-qwen}
      base-url: ${QWEN_VL_BASE_URL:http://127.0.0.1:8092}
      model: ${QWEN_VL_MODEL:qwen3-vl-4b-instruct-q4-k-m}
      timeout: ${QWEN_VL_TIMEOUT:PT5M}
    web-search:
      provider: ${WEB_SEARCH_PROVIDER:auto}
      tavily-api-key: ${TAVILY_API_KEY:}
      tavily-base-url: ${TAVILY_BASE_URL:https://api.tavily.com}
      timeout: ${WEB_SEARCH_TIMEOUT:PT20S}
  agent:
    async:
      enabled: ${AGENT_ASYNC_ENABLED:false}
      queue: ${AGENT_QUEUE:originguard.agent.analysis}
    cache:
      enabled: ${AGENT_CACHE_ENABLED:true}
      ttl: ${AGENT_CACHE_TTL:PT6H}
    rate-limit:
      requests-per-minute: ${AGENT_REQUESTS_PER_MINUTE:20}
    max-replans: ${AGENT_MAX_REPLANS:6}
    aigc-detector:
      provider: ${AIGC_DETECTOR_PROVIDER:model-api}
      base-url: ${MODEL_API_BASE_URL:http://127.0.0.1:8090}
      timeout: ${AIGC_DETECTOR_TIMEOUT:PT10M}
    illustration-detector:
      enabled: ${ANIXPLORE_ENABLED:false}
      base-url: ${MODEL_API_BASE_URL:http://127.0.0.1:8090}
      timeout: ${ANIXPLORE_TIMEOUT:PT10M}
    diffusion-verifier:
      enabled: ${AEROBLADE_ENABLED:false}
      base-url: ${MODEL_API_BASE_URL:http://127.0.0.1:8090}
      timeout: ${AEROBLADE_TIMEOUT:PT15M}
    media-type-classifier:
      provider: ${MEDIA_TYPE_CLASSIFIER_PROVIDER:model-api}
      base-url: ${MODEL_API_BASE_URL:http://127.0.0.1:8090}
      timeout: ${CLIP_CLASSIFIER_TIMEOUT:PT2M}
    c2pa:
      enabled: ${C2PA_ENABLED:false}
      base-url: ${C2PA_BASE_URL:http://127.0.0.1:8091}
      timeout: ${C2PA_TIMEOUT:PT45S}
    aigc-explainer:
      provider: ${AIGC_EXPLAINER_PROVIDER:template}
      base-url: ${QWEN_VL_BASE_URL:http://127.0.0.1:8092}
      model: ${QWEN_VL_MODEL:qwen3-vl-4b-instruct-q4-k-m}
      timeout: ${QWEN_VL_TIMEOUT:PT5M}
      max-image-edge: ${QWEN_VL_MAX_IMAGE_EDGE:896}
    planner:
      provider: ${AGENT_PLANNER_PROVIDER:fake}
      base-url: ${QWEN_VL_BASE_URL:http://127.0.0.1:8092}
      model: ${QWEN_VL_MODEL:qwen3-vl-4b-instruct-q4-k-m}
      timeout: ${QWEN_VL_TIMEOUT:PT5M}
      max-image-edge: ${QWEN_VL_MAX_IMAGE_EDGE:896}
