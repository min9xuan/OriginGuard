openapi: 3.1.0
info:
  title: OriginGuard API
  version: 0.1.0
  description: M0 contract skeleton; endpoints are added with their owning domain milestone.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [System]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated; refresh token is returned as an HttpOnly cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/refresh:
    post:
      operationId: refreshAccessToken
      tags: [Identity]
      security: []
      responses:
        '200':
          description: Refresh token rotated and a new access token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Identity]
      security: []
      responses:
        '204': { description: Refresh token revoked and cookie cleared }
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Identity]
      responses:
        '200':
          description: Current authenticated user and effective permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/identity/summary:
    get:
      operationId: getTenantIdentitySummary
      tags: [Administration]
      responses:
        '200':
          description: Identity counts scoped to the authenticated tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantIdentitySummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Authenticated user lacks the required permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status: { type: string, const: UP }
        service: { type: string }
        timestamp: { type: string, format: date-time }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [tenantCode, username, password]
      properties:
        tenantCode: { type: string, pattern: '^[a-zA-Z0-9_-]{2,64}$' }
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, format: password }
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/UserView' }
    UserView:
      type: object
      required: [id, tenantId, tenantCode, username, displayName, roles, permissions]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        tenantCode: { type: string }
        username: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
    TenantIdentitySummary:
      type: object
      required: [tenantId, tenantCode, users, enabledUsers]
      properties:
        tenantId: { type: string, format: uuid }
        tenantCode: { type: string }
        users: { type: integer }
        enabledUsers: { type: integer }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

security:
  - bearerAuth: []
