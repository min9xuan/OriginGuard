openapi: 3.1.0
info:
  title: OriginGuard API
  version: 0.7.0
  description: M3.3 contract connecting Agent observations to formal case evidence and cited review decisions.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [System]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated; refresh token is returned as an HttpOnly cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/refresh:
    post:
      operationId: refreshAccessToken
      tags: [Identity]
      security: []
      responses:
        '200':
          description: Refresh token rotated and a new access token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Identity]
      security: []
      responses:
        '204': { description: Refresh token revoked and cookie cleared }
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Identity]
      responses:
        '200':
          description: Current authenticated user and effective permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/identity/summary:
    get:
      operationId: getTenantIdentitySummary
      tags: [Administration]
      responses:
        '200':
          description: Identity counts scoped to the authenticated tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantIdentitySummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/assets:
    get:
      operationId: listMediaAssets
      tags: [Media]
      responses:
        '200':
          description: Media records in the authenticated tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MediaAsset' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: registerMediaAsset
      tags: [Media]
      description: Registers metadata and a SHA-256 fingerprint; M1.1 does not upload file bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterMediaAssetRequest' }
      responses:
        '201':
          description: Media record created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      operationId: getMediaAsset
      tags: [Media]
      responses:
        '200':
          description: Tenant-scoped media record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/assets/upload:
    post:
      operationId: uploadMediaAsset
      tags: [Media]
      description: Stores JPEG or PNG bytes, verifies browser/server SHA-256, validates file signature and decoding, and persists basic forensic metadata.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, sha256]
              properties:
                file: { type: string, format: binary }
                sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
      responses:
        '201':
          description: Media bytes stored and verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/assets/{assetId}/content:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      operationId: getMediaContent
      tags: [Media]
      description: Returns tenant-scoped stored media bytes after asset:read authorization.
      responses:
        '200':
          description: Original verified media content
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/cases:
    get:
      operationId: listInvestigationCases
      tags: [Investigation]
      responses:
        '200':
          description: Cases in the authenticated tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InvestigationCase' }
    post:
      operationId: createInvestigationCase
      tags: [Investigation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCaseRequest' }
      responses:
        '201':
          description: Draft case created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      operationId: getInvestigationCase
      tags: [Investigation]
      responses:
        '200':
          description: Case and linked media records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetails' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateInvestigationCase
      tags: [Investigation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCaseRequest' }
      responses:
        '200':
          description: Case updated using optimistic locking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/cases/{caseId}/assets:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: linkMediaAssetToCase
      tags: [Investigation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkAssetRequest' }
      responses:
        '200':
          description: Media record linked to the draft or rejected case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/cases/{caseId}/transitions:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: transitionInvestigationCase
      tags: [Investigation]
      description: Investigator transitions through WAITING_REVIEW; submission requires an assigned independent reviewer and at least one evidence record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionCaseRequest' }
      responses:
        '200':
          description: Case status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/cases/assignees:
    get:
      operationId: listCaseAssignees
      tags: [Investigation]
      responses:
        '200':
          description: Enabled investigators and reviewers in the authenticated tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssignableUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/cases/{caseId}/assignment:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: assignCaseDuties
      tags: [Investigation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentRequest' }
      responses:
        '200':
          description: Investigator and independent reviewer assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationCase' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/cases/{caseId}/workflow:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      operationId: getInvestigationWorkflow
      tags: [Investigation, Review]
      responses:
        '200':
          description: Immutable evidence and review task history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cases/{caseId}/evidence:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: addHumanEvidence
      tags: [Investigation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddEvidenceRequest' }
      responses:
        '200':
          description: Human observation appended to the case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationEvidence' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/cases/{caseId}/evidence/from-agent:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      operationId: promoteAgentObservationToEvidence
      tags: [Investigation, Agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoteAgentObservationRequest' }
      responses:
        '200':
          description: Agent observation explicitly included as formal case evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationEvidence' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/cases/{caseId}/reviews/{taskId}/decision:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - $ref: '#/components/parameters/ReviewTaskId'
    post:
      operationId: decideReviewTask
      tags: [Review]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewDecisionRequest' }
      responses:
        '200':
          description: Review decided and case moved to CONFIRMED or REJECTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/cases/{caseId}/audit:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      operationId: getCaseAuditHistory
      tags: [Audit]
      responses:
        '200':
          description: Append-only audit entries for the case
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/agent-tasks:
    get:
      operationId: listAgentTasks
      tags: [Agent]
      responses:
        '200':
          description: Agent tasks visible in the authenticated tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgentTask' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAgentTask
      tags: [Agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentTaskRequest' }
      responses:
        '200':
          description: Pending Agent task created for an investigating case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTaskDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/agent-tasks/{agentTaskId}:
    parameters:
      - $ref: '#/components/parameters/AgentTaskId'
    get:
      operationId: getAgentTask
      tags: [Agent]
      responses:
        '200':
          description: Task with ordered Trace, Observations, and Checkpoints
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTaskDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/agent-tasks/{agentTaskId}/run:
    parameters:
      - $ref: '#/components/parameters/AgentTaskId'
    post:
      operationId: runAgentTask
      tags: [Agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTaskVersionRequest' }
      responses:
        '200':
          description: Deterministic M2.1 task completed or failed with persisted Trace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTaskDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/agent-tasks/{agentTaskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/AgentTaskId'
    post:
      operationId: cancelAgentTask
      tags: [Agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentTaskVersionRequest' }
      responses:
        '200':
          description: Pending task cancelled by its creator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentTaskDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  parameters:
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReviewTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentTaskId:
      name: agentTaskId
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Authenticated user lacks the required permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource does not exist in the authenticated tenant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: State, version, or uniqueness conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationFailed:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status: { type: string, const: UP }
        service: { type: string }
        timestamp: { type: string, format: date-time }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [tenantCode, username, password]
      properties:
        tenantCode: { type: string, pattern: '^[a-zA-Z0-9_-]{2,64}$' }
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, format: password }
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/UserView' }
    UserView:
      type: object
      required: [id, tenantId, tenantCode, username, displayName, roles, permissions]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        tenantCode: { type: string }
        username: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
    TenantIdentitySummary:
      type: object
      required: [tenantId, tenantCode, users, enabledUsers]
      properties:
        tenantId: { type: string, format: uuid }
        tenantCode: { type: string }
        users: { type: integer }
        enabledUsers: { type: integer }
    RegisterMediaAssetRequest:
      type: object
      additionalProperties: false
      required: [originalFilename, contentType, byteSize, sha256]
      properties:
        originalFilename: { type: string, maxLength: 255 }
        contentType: { type: string, maxLength: 127, pattern: '^[iI][mM][aA][gG][eE]/[a-zA-Z0-9.+-]{1,100}$' }
        byteSize: { type: integer, format: int64, minimum: 1, maximum: 5368709120 }
        sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
    MediaAsset:
      type: object
      required: [id, tenantId, originalFilename, contentType, byteSize, sha256, storageStatus, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        originalFilename: { type: string }
        contentType: { type: string }
        byteSize: { type: integer, format: int64 }
        sha256: { type: string }
        storageStatus: { type: string, enum: [REGISTERED, STORED, QUARANTINED] }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    CasePriority:
      type: string
      enum: [LOW, NORMAL, HIGH, CRITICAL]
    CaseStatus:
      type: string
      enum: [DRAFT, READY, INVESTIGATING, WAITING_REVIEW, CONFIRMED, REJECTED, FAILED, ARCHIVED]
    InvestigationCase:
      type: object
      required: [id, tenantId, caseNumber, title, description, priority, status, createdBy, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        caseNumber: { type: string }
        title: { type: string }
        description: { type: string }
        priority: { $ref: '#/components/schemas/CasePriority' }
        status: { $ref: '#/components/schemas/CaseStatus' }
        createdBy: { type: string, format: uuid }
        assignedInvestigatorId: { type: [string, 'null'], format: uuid }
        assignedReviewerId: { type: [string, 'null'], format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CaseMediaAsset:
      type: object
      required: [id, originalFilename, contentType, byteSize, sha256, storageStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        originalFilename: { type: string }
        contentType: { type: string }
        byteSize: { type: integer, format: int64 }
        sha256: { type: string }
        storageStatus: { type: string, enum: [REGISTERED, STORED, QUARANTINED] }
        createdAt: { type: string, format: date-time }
    CaseDetails:
      type: object
      required: [investigationCase, assets]
      properties:
        investigationCase: { $ref: '#/components/schemas/InvestigationCase' }
        assets:
          type: array
          items: { $ref: '#/components/schemas/CaseMediaAsset' }
    CreateCaseRequest:
      type: object
      additionalProperties: false
      required: [title, priority, assetIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000, default: '' }
        priority: { $ref: '#/components/schemas/CasePriority' }
        assetIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
    UpdateCaseRequest:
      type: object
      additionalProperties: false
      required: [title, priority, version]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000, default: '' }
        priority: { $ref: '#/components/schemas/CasePriority' }
        version: { type: integer, format: int64, minimum: 0 }
    LinkAssetRequest:
      type: object
      additionalProperties: false
      required: [assetId, version]
      properties:
        assetId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
    TransitionCaseRequest:
      type: object
      additionalProperties: false
      required: [targetStatus, version]
      properties:
        targetStatus:
          type: string
          enum: [READY, INVESTIGATING, WAITING_REVIEW]
        version: { type: integer, format: int64, minimum: 0 }
    AssignableUser:
      type: object
      required: [id, username, displayName, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [INVESTIGATOR, REVIEWER] }
    AssignmentRequest:
      type: object
      additionalProperties: false
      required: [investigatorId, reviewerId, version]
      properties:
        investigatorId: { type: string, format: uuid }
        reviewerId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
    EvidenceConclusion:
      type: string
      enum: [LIKELY_AUTHENTIC, LIKELY_SYNTHETIC, INCONCLUSIVE]
    EvidenceConfidence:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    AddEvidenceRequest:
      type: object
      additionalProperties: false
      required: [assetId, title, observation, conclusion, confidence, version]
      properties:
        assetId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        observation: { type: string, minLength: 1, maxLength: 4000 }
        conclusion: { $ref: '#/components/schemas/EvidenceConclusion' }
        confidence: { $ref: '#/components/schemas/EvidenceConfidence' }
        version: { type: integer, format: int64, minimum: 0 }
    InvestigationEvidence:
      type: object
      required: [id, assetId, evidenceType, title, observation, conclusion, confidence, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        evidenceType: { type: string, enum: [HUMAN_OBSERVATION, AGENT_OBSERVATION] }
        title: { type: string }
        observation: { type: string }
        conclusion: { $ref: '#/components/schemas/EvidenceConclusion' }
        confidence: { $ref: '#/components/schemas/EvidenceConfidence' }
        sourceObservationId: { type: [string, 'null'], format: uuid }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    ReviewStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    ReviewTask:
      type: object
      required: [id, reviewerId, status, decisionReason, createdBy, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        reviewerId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ReviewStatus' }
        decisionReason: { type: string }
        createdBy: { type: string, format: uuid }
        decidedBy: { type: [string, 'null'], format: uuid }
        citedEvidenceIds:
          type: array
          items: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    WorkflowView:
      type: object
      required: [evidence, reviewTasks, agentEvidenceCandidates]
      properties:
        evidence:
          type: array
          items: { $ref: '#/components/schemas/InvestigationEvidence' }
        reviewTasks:
          type: array
          items: { $ref: '#/components/schemas/ReviewTask' }
        agentEvidenceCandidates:
          type: array
          items: { $ref: '#/components/schemas/AgentEvidenceCandidate' }
    AgentEvidenceCandidate:
      type: object
      required: [observationId, taskId, assetId, evidenceType, summary, payload, createdAt]
      properties:
        observationId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        evidenceType: { type: string, enum: [FILE_INTEGRITY, IMAGE_METADATA, PERCEPTUAL_SIMILARITY] }
        summary: { type: string }
        payload: { type: object, additionalProperties: true }
        promotedEvidenceId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    PromoteAgentObservationRequest:
      type: object
      additionalProperties: false
      required: [observationId, version]
      properties:
        observationId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, citedEvidenceIds, taskVersion, caseVersion]
      properties:
        decision: { type: string, enum: [APPROVED, REJECTED] }
        reason: { type: string, maxLength: 2000, default: '' }
        citedEvidenceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        taskVersion: { type: integer, format: int64, minimum: 0 }
        caseVersion: { type: integer, format: int64, minimum: 0 }
    AuditEntry:
      type: object
      required: [id, action, details, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorUserId: { type: [string, 'null'], format: uuid }
        action: { type: string }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    AgentTaskStatus:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED]
    AgentTask:
      type: object
      required: [id, tenantId, caseId, createdBy, status, goal, remainingStepBudget, conclusion, checkpointVersion, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        createdBy: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AgentTaskStatus' }
        goal: { type: string }
        selectedSkillCode: { type: [string, 'null'] }
        selectedSkillVersion: { type: [string, 'null'] }
        remainingStepBudget: { type: integer, minimum: 0 }
        conclusion: { type: object, additionalProperties: true }
        failureCode: { type: [string, 'null'] }
        failureMessage: { type: [string, 'null'] }
        checkpointVersion: { type: integer, minimum: 0 }
        version: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentStep:
      type: object
      required: [id, taskId, sequenceNumber, stepType, status, skillCode, toolCode, input, output, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        sequenceNumber: { type: integer, minimum: 1 }
        stepType: { type: string }
        status: { type: string, enum: [SUCCEEDED, FAILED] }
        skillCode: { type: string }
        toolCode: { type: string }
        input: { type: object, additionalProperties: true }
        output: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AgentObservation:
      type: object
      required: [id, taskId, caseId, evidenceType, summary, payload, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        assetId: { type: [string, 'null'], format: uuid }
        evidenceType: { type: string, enum: [MEDIA_METADATA, BASIC_MEDIA_FORENSICS, FILE_INTEGRITY, IMAGE_METADATA, PERCEPTUAL_SIMILARITY] }
        summary: { type: string }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AgentCheckpoint:
      type: object
      required: [id, taskId, checkpointVersion, state, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        checkpointVersion: { type: integer, minimum: 1 }
        state: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AgentTaskDetails:
      type: object
      required: [task, steps, observations, checkpoints]
      properties:
        task: { $ref: '#/components/schemas/AgentTask' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/AgentStep' }
        observations:
          type: array
          items: { $ref: '#/components/schemas/AgentObservation' }
        checkpoints:
          type: array
          items: { $ref: '#/components/schemas/AgentCheckpoint' }
    CreateAgentTaskRequest:
      type: object
      additionalProperties: false
      required: [caseId, goal, stepBudget]
      properties:
        caseId: { type: string, format: uuid }
        goal: { type: string, minLength: 1, maxLength: 500 }
        stepBudget: { type: integer, minimum: 7, maximum: 10 }
    AgentTaskVersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 0 }

security:
  - bearerAuth: []
